# ===============================
# POSTGRESQL (Relational - Structured Data)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/medisync_db
spring.datasource.username=postgres
spring.datasource.password=00000000
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# MONGODB (NoSQL - Flexible Documents)
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/medisync_nosql