# ===============================
# POSTGRESQL (Relational - Structured Data)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/medisync
spring.datasource.username=postgres
spring.datasource.password=00000000
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.error.include-message=always

# Load local secrets from medisync-backend/.env when running locally.
# If you start the app from the repository root, the second import covers that path.
spring.config.import=optional:file:.env[.properties],optional:file:medisync-backend/.env[.properties]
# ===============================
# MONGODB (NoSQL - Flexible Documents)
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/medisync_nosql?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000

# JWT Security Key - Authored by redouaneachak
application.security.jwt.secret-key=404E635266556A586E3272357redouaneachak28472B4B6250645367566B5970

# Web Server Configuration
server.port=${SERVER_PORT:8443}

# SSL/TLS Configuration
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=medisync123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=medisync

google.client-id=${GOOGLE_CLIENT_ID:disabled}

# Google OAuth2 redirect login (/oauth2/authorization/google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Max size for a single file
spring.servlet.multipart.max-file-size=20MB

# Max size for the entire request (in case you upload multiple files at once later)
spring.servlet.multipart.max-request-size=20MB
