<div class="app-shell">
  <header class="topbar">
    <a routerLink="/" class="brand" aria-label="MediSync home">
      <span class="brand-mark">M</span>
      <span>MediSync</span>
    </a>
    <nav class="top-nav" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
      <a routerLink="/doctors" routerLinkActive="active">Medecins</a>
      <a routerLink="/booking" routerLinkActive="active">Rendez-vous</a>
      <a routerLink="/medical-record" routerLinkActive="active">Dossier</a>
      <a routerLink="/billing" routerLinkActive="active">Factures</a>
    </nav>
    <div class="top-actions">
      <a routerLink="/notifications" class="icon-button" aria-label="Notifications">!</a>
      <a routerLink="/login" class="btn secondary">Connexion</a>
    </div>
  </header>

  <aside class="sidebar">
    <span class="sidebar-label">Espace clinique</span>
    <a routerLink="/appointments" routerLinkActive="active">Planning</a>
    <a routerLink="/patients" routerLinkActive="active">Patients</a>
    <a routerLink="/rooms" routerLinkActive="active">Salles</a>
    <a routerLink="/profile" routerLinkActive="active">Profil</a>
    <a routerLink="/admin" routerLinkActive="active">Admin</a>
  </aside>

  <main class="page">
    <router-outlet />
  </main>
</div>
