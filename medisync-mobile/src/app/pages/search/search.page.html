<ion-content [fullscreen]="true" class="search-content">

  <!-- Header -->
  <div class="search-header">
    <div class="app-name">MediSync</div>
    <div class="header-title">Trouver un médecin</div>
  </div>

  <!-- Barre de recherche -->
  <div class="search-bar-container">
    <div class="search-bar">
      <span>🔍</span>
      <input
        type="text"
        placeholder="Nom, spécialité..."
        [(ngModel)]="searchQuery"
        (input)="filterDoctors()">
    </div>
  </div>

  <!-- Filtres -->
  <div class="filters-row">
    <div class="f-chip" [class.on]="activeFilter === 'Tous'" (click)="setFilter('Tous')">Tous</div>
    <div class="f-chip" [class.on]="activeFilter === 'Cardiologue'" (click)="setFilter('Cardiologue')">Cardiologue</div>
    <div class="f-chip" [class.on]="activeFilter === 'Généraliste'" (click)="setFilter('Généraliste')">Généraliste</div>
    <div class="f-chip" [class.on]="activeFilter === 'Pédiatre'" (click)="setFilter('Pédiatre')">Pédiatre</div>
    <div class="f-chip" [class.on]="activeFilter === 'Dermatologue'" (click)="setFilter('Dermatologue')">Dermatologue</div>
  </div>

  <div class="scroll-content">

    <!-- Résultats -->
    <div class="section-label">{{ filteredDoctors.length }} médecin(s) trouvé(s)</div>

    <div class="doctor-card" *ngFor="let doctor of filteredDoctors" (click)="goToBooking(doctor)">
      <div class="avatar" [style.background]="doctor.avatarBg" [style.color]="doctor.avatarColor">
        {{ doctor.initials }}
      </div>
      <div class="doctor-info">
        <div class="doctor-name">{{ doctor.name }}</div>
        <div class="doctor-specialty">{{ doctor.specialty }}</div>
        <div class="doctor-meta">
          <span>⭐ {{ doctor.rating }}</span>
          <span>📍 {{ doctor.location }}</span>
          <span class="pill pill-green" *ngIf="doctor.available">Disponible</span>
        </div>
      </div>
      <div class="chevron">›</div>
    </div>

    <div style="height: 80px;"></div>
  </div>

</ion-content>

<app-tab-bar currentPage="search"></app-tab-bar>
